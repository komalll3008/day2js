<body>

<script>
    let randomNumber = Math.random();
    let result;
    let guess = "heads";

    if (randomNumber < 0.5) {
        result = "heads";
    } else {
        result = "tails";
    }

    if (guess === result) {
        console.log("You win!");
    } else {
        console.log("You lose!");
    }
</script>

</body>
