<!DOCTYPE html>
<html>
<head>
    <title>7d</title>
</head>
<body>

<button onclick="showResult()">Convert 25°C</button>

<p id="result"></p>

<script>
function convertToFahrenheit(celsius) {
    return (celsius * 9 / 5) + 32;
}

function showResult() {

    const result = convertToFahrenheit(25);

    document.getElementById('result').innerHTML =
        `25°C = ${result}°F`;

    console.log(result);
}

showResult();
</script>

</body>
</html>
