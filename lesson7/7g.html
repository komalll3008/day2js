<!DOCTYPE html>
<html>
<head>
    <title>7g</title>
</head>
<body>

<button onclick="testLength()">Convert Length</button>

<p id="result"></p>

<script>
function convertLength(length, from, to) {

    if (from === 'miles' && to === 'km') {
        return `${length * 1.6} km`;
    }

    if (from === 'km' && to === 'miles') {
        return `${length / 1.6} miles`;
    }

    if (from === to) {
        return `${length} ${to}`;
    }
}

function testLength() {

    const result1 =
        convertLength(50, 'miles', 'km');

    const result2 =
        convertLength(32, 'km', 'miles');

    document.getElementById('result').innerHTML =
        `${result1}<br>${result2}`;

    console.log(result1);
    console.log(result2);
}

testLength();
</script>

</body>
</html>
