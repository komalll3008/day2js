<!DOCTYPE html>
<html>
<head>
    <title>7h</title>
</head>
<body>

<button onclick="testLength()">Convert Length</button>

<p id="result"></p>

<script>
function convertLength(length, from, to) {

    if (from === to) {
        return `${length} ${to}`;
    }

    if (from === 'miles' && to === 'km') {
        return `${length * 1.6} km`;
    }

    if (from === 'km' && to === 'miles') {
        return `${length / 1.6} miles`;
    }

    if (from === 'miles' && to === 'ft') {
        return `${length * 5280} ft`;
    }

    if (from === 'ft' && to === 'miles') {
        return `${length / 5280} miles`;
    }

    if (from === 'km' && to === 'ft') {
        return `${length * 3281} ft`;
    }

    if (from === 'ft' && to === 'km') {
        return `${length / 3281} km`;
    }
}

function testLength() {

    const result1 =
        convertLength(5, 'miles', 'km');

    const result2 =
        convertLength(5, 'miles', 'ft');

    const result3 =
        convertLength(5, 'km', 'ft');

    document.getElementById('result').innerHTML =
        `${result1}<br>${result2}<br>${result3}`;

    console.log(result1);
    console.log(result2);
    console.log(result3);
}

testLength();
</script>

</body>
</html>
