<!DOCTYPE html>
<html>
<head>
    <title>7i</title>
</head>
<body>

<button onclick="testLength()">Test</button>

<p id="result"></p>

<script>
function convertLength(length, from, to) {

    if (from !== 'km' &&
        from !== 'miles' &&
        from !== 'ft') {

        return `Invalid unit: ${from}`;
    }

    if (to !== 'km' &&
        to !== 'miles' &&
        to !== 'ft') {

        return `Invalid unit: ${to}`;
    }

    if (from === to) {
        return `${length} ${to}`;
    }

    if (from === 'miles' && to === 'km') {
        return `${length * 1.6} km`;
    }

    if (from === 'km' && to === 'miles') {
        return `${length / 1.6} miles`;
    }

    if (from === 'miles' && to === 'ft') {
        return `${length * 5280} ft`;
    }

    if (from === 'ft' && to === 'miles') {
        return `${length / 5280} miles`;
    }

    if (from === 'km' && to === 'ft') {
        return `${length * 3281} ft`;
    }

    if (from === 'ft' && to === 'km') {
        return `${length / 3281} km`;
    }
}

function testLength() {

    const result =
        convertLength(5, 'lbs', 'lbs');

    document.getElementById('result').innerHTML =
        result;

    console.log(result);
}

testLength();
</script>

</body>
</html>
